# Weekly dependency PRs across every workspace package.json and the GitHub
# Actions workflows. Major bumps are opt-in only via security advisories;
# the routine queue is minor + patch grouped so it stays actionable. A
# security update that requires a major bump still gets opened by
# Dependabot: `ignore` rules do not apply to security updates.
#
# Directory coverage:
#   bun            -> / (workspace root; Dependabot walks the workspace tree
#                        and proposes bumps against each packages/* member's
#                        package.json, resolved through the root bun.lock)
#   github-actions -> / (all workflows under .github/workflows/)

version: 2

updates:
  # Bun workspace root. Covers every member declared in the root
  # package.json workspaces (packages/*).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  # GitHub Actions bumps for ci.yml and release.yml. Lower PR cap since the
  # surface area is small.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
